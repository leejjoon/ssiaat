[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssiaat"
version = "0.0.1"
authors = [
  { name="Jae-Joon Lee", email="leejjoon@kasi.re.kr" },
]
description = "SPHEREx Spectral Image as a Table"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy",
    "reproject",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "requests",
    "tqdm",
    "aiohttp",
    # Upper pins work around a Google Colab incompatibility (2026-07).
    # Revisit when Colab updates; s3 access goes through s3fs, not boto3.
    "fsspec[http]<=2025.3.0",
    "s3fs<=2025.3.0",
    # s3fs<=2025.3.0 pulls aiobotocore (<3.0), which caps botocore<1.41.6.
    # A newer botocore -- readily dragged in when coiled/boto3/awscli share
    # the venv -- breaks aiobotocore's endpoint resolver
    # (ClientArgsCreator.compute_endpoint_resolver_builtin_defaults() missing
    # 's3_disable_express_session_auth'), which makes every S3 read/write fail
    # (the finder, the dask HiPS pipeline). Pin it so it cannot drift up.
    "botocore>=1.41.0,<1.41.6",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pyarrow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests (deselected by default)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssiaat = ["ZodiScaling70Channels_0329/*.csv"]
